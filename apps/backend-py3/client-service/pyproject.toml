[project]
name = "fasio-client-service"
version = "0.1.0"
description = "Facio MVP client-service API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.6",
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.29.0",
    "alembic>=1.13.3",
    "pydantic-settings>=2.5.2",
    "pydantic>=2.9.0",
    "anthropic>=0.64.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "httpx>=0.27.2",
    "ruff>=0.6.0",
]
