[project]
name = "facio-api"
version = "0.0.1"
description = "Facio thin HTTP: one turn, a validated patch. No Path, no desk store."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "facio-domain",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.5.0",
    "anthropic>=0.64.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
