services:
  talk:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: facio-talk
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
      - path: apps/api/.env
        required: false
    environment:
      FACIO_GOLDENS_DIR: /app/apps/api/goldens
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/v1/health')",
        ]
      interval: 5s
      timeout: 3s
      retries: 8
