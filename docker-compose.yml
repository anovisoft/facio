services:
  fasio-postgres:
    image: postgres:16-alpine
    container_name: fasio-postgres
    environment:
      POSTGRES_USER: ${FASIO_POSTGRES_USER:-fasio}
      POSTGRES_PASSWORD: ${FASIO_POSTGRES_PASSWORD:-fasio}
      POSTGRES_DB: ${FASIO_POSTGRES_DB:-fasio}
    ports:
      - "5435:5432"
    volumes:
      - fasio_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${FASIO_POSTGRES_USER:-fasio} -d ${FASIO_POSTGRES_DB:-fasio}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  fasio-backend:
    build:
      context: ./apps/backend-py3/client-service
      dockerfile: Dockerfile
    container_name: fasio-backend
    environment:
      DATABASE_URL: postgresql+asyncpg://${FASIO_POSTGRES_USER:-fasio}:${FASIO_POSTGRES_PASSWORD:-fasio}@fasio-postgres:5432/${FASIO_POSTGRES_DB:-fasio}
      APP_NAME: ${FASIO_APP_NAME:-Facio API}
      DEBUG: ${FASIO_DEBUG:-false}
      CORS_ORIGINS: ${FASIO_CORS_ORIGINS:-*}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-claude-sonnet-5}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-8192}
      LLM_PROMPT_CACHE: ${LLM_PROMPT_CACHE:-true}
      LLM_PROMPT_CACHE_TTL: ${LLM_PROMPT_CACHE_TTL:-5m}
      LOG_LEVEL: ${FASIO_LOG_LEVEL:-INFO}
      LOG_DIR: ${FASIO_LOG_DIR:-/app/logs}
      LOG_BACKUP_COUNT: ${FASIO_LOG_BACKUP_COUNT:-30}
    ports:
      - "8000:8000"
    depends_on:
      fasio-postgres:
        condition: service_healthy
    volumes:
      - ./apps/backend-py3/client-service/app:/app/app:ro
      - ./apps/backend-py3/client-service/logs:/app/logs

volumes:
  fasio_postgres_data:
