[project]
name = "facio-domain"
version = "0.0.1"
description = "Facio domain law: subject, cue, cadence, derived drift, lid projection."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "pytest>=8.0",
]

[project.scripts]
facio-export-schema = "facio_domain.export_schema:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
