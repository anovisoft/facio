name: domain tests

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install domain package
        run: pip install -e packages/domain

      - name: Run domain tests
        run: pytest packages/domain -v

      # The README says «over 300 tests», and a number in prose is a promise
      # nobody remembers to keep — this one had drifted to a third of the truth
      # before anybody noticed. A floor is a claim that only breaks when
      # something is actually wrong, and this is what keeps it honest.
      - name: The README's floor on the test count still holds
        run: |
          count=$(pytest packages/domain --collect-only -q | tail -1 | grep -oE '^[0-9]+' || true)
          echo "collected: ${count:-unreadable}"
          if [ -z "$count" ]; then
            echo "Could not read a test count out of pytest --collect-only."
            exit 1
          fi
          if [ "$count" -lt 300 ]; then
            echo "README claims over 300 domain tests; collected $count. Fix one or the other."
            exit 1
          fi

      - name: Check the exported schema is current
        run: |
          facio-export-schema
          git diff --exit-code -- packages/schema || {
            echo "Exported JSON Schema differs from what is committed. Run facio-export-schema and commit the result."
            exit 1
          }
